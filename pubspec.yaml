publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  uuid: ^4.3.3
  crypto: ^3.0.3
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  audioplayers: ^6.8.1
  cached_network_image: ^3.4.1
  mobile_scanner: ^7.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
